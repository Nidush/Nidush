name: CI/CD Nidush

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      EXPO_PUBLIC_SUPABASE_ANON_KEY: placeholder-key
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Run Unit Tests
        run: npm test

      - name: Run ESLint
        run: npm run lint || echo "Lint failed but continuing"

      - name: Compile TypeScript
        run: npx tsc --noEmit

      - name: Build project
        run: npm run build

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-files
          path: dist/

  selenium-tests:
    name: Selenium E2E Tests
    runs-on: ubuntu-latest
    needs: build-test
    env:
      EXPO_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      EXPO_PUBLIC_SUPABASE_ANON_KEY: placeholder-key
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: dist-files
          path: dist/

      - name: Start Web Server
        run: |
          npx serve -s dist -l 8081 &
          sleep 5

      - name: Run Selenium Tests
        run: npm run test:e2e

  deploy:
    name: Deploy to Netlify
    runs-on: ubuntu-latest
    needs: selenium-tests
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: dist-files
          path: dist/

      - name: Deploy to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.SITEID }}
        run: |
          npx netlify-cli deploy --dir=dist --prod --message="Deploy from GitHub Actions" --auth=$NETLIFY_AUTH_TOKEN --site=$NETLIFY_SITE_ID