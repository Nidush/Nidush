name: Supabase Migration Validator

on:
  push:
    branches: ["main", "feature/**"]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  test-migrations:
    name: Test DB Migrations
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Local Supabase
        run: |
          supabase init
          # O --cb (control bar) e outros serviços não são necessários para teste de migração
          supabase start --ignore-health-check
          
      - name: Verify Migrations (Reset & Push)
        run: |
          # Isso garante que todas as migrations na pasta /supabase/migrations são válidas
          supabase db reset
