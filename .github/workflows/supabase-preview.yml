name: Supabase Preview

on:
  push:
    branches: ["main", "feature/**"]
  pull_request:
  workflow_dispatch:

jobs:
  database-preview:
    name: Database Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Supabase Local Stack
        run: supabase start

      - name: Apply Migrations
        run: |
          echo "Aplicando migrations localmente..."
          supabase db reset
          echo "Migrations aplicadas com sucesso!"

      - name: Lint SQL (opcional mas recomendado)
        run: |
          echo "Validando SQL..."
          for file in supabase/migrations/*.sql; do
            echo "Checking $file"
            # aqui podes integrar sqlfluff ou outro linter
          done

      - name: Stop Supabase
        if: always()
        run: supabase stop