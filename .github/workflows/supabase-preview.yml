name: Supabase Linter

on:
  push:
    branches: ["main", "feature/**"]
  pull_request:

jobs:
  lint-database:
    name: Lint Database
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Verify Migration Syntax
        run: |
          # O comando 'lint' apenas checa se o SQL está correto. 
          # É o mínimo possível para garantir que nada quebre.
          supabase db lint
