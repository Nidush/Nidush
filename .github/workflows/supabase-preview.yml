name: Supabase Linter

on:
  push:
    branches: ["main", "feature/**"]
  pull_request:

jobs:
  lint-database:
    name: Lint Database
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Lightweight Postgres
        run: |
          # Sobe apenas o banco puro, sem o resto do Supabase, para ser instantâneo
          docker run --name db -e POSTGRES_PASSWORD=postgres -p 54322:5432 -d postgres:alpine
          # Aguarda o banco ficar pronto
          sleep 5

      - name: Verify Migration Syntax
        run: |
          # Valida o SQL contra o banco temporário
          supabase db lint --db-url postgresql://postgres:postgres@localhost:54322/postgres
