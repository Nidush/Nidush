name: Supabase Status Report

on:
  push:
    branches: ["main", "feature/**"]
  pull_request:
  workflow_dispatch:

jobs:
  supabase-report:
    name: Supabase Status
    runs-on: ubuntu-latest
    
    # Precisamos das chaves para falar com o seu projeto real
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Check Migration Status
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "Erro: SUPABASE_ACCESS_TOKEN não configurada nas Secrets do GitHub."
            exit 1
          fi
          
          echo "Buscando status das migrações no projeto: $SUPABASE_PROJECT_ID"
          
          # Mostra a versão e o status das migrações (remotas vs locais)
          # Isso gera um "log" real do Supabase dentro do GitHub
          supabase migration list --project-ref $SUPABASE_PROJECT_ID
