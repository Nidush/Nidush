name: Supabase CI/CD

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      deploy_to_supabase:
        description: "Deploy migrations and Edge Functions to Supabase"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: supabase-${{ github.ref }}
  cancel-in-progress: true

env:
  EXPO_NO_TELEMETRY: "1"
  EXPO_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
  EXPO_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key

jobs:
  app-tests:
    name: App tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=moderate

      - name: Run unit tests
        run: npm test -- --runInBand

      - name: Compile TypeScript
        run: npx tsc --noEmit

      - name: Build web app
        run: npm run build

  supabase-tests:
    name: Supabase tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: latest

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: latest

      - name: Start local database
        run: supabase db start

      - name: Apply migrations locally
        run: supabase db reset

      - name: Lint database schema
        run: supabase db lint --local --schema public --fail-on error

      - name: Run database tests
        run: supabase test db supabase/tests/database

      - name: Lint Edge Functions
        run: deno lint supabase/functions

      - name: Type-check Edge Functions
        run: find supabase/functions -name "index.ts" -print0 | xargs -0 deno check

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup

  deploy-supabase:
    name: Deploy Supabase
    runs-on: ubuntu-latest
    needs: [app-tests, supabase-tests]
    environment: production
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' ||
      github.event_name == 'workflow_dispatch' && inputs.deploy_to_supabase == true

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: latest

      - name: Check Supabase secrets
        run: |
          missing=0
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_PROJECT_REF SUPABASE_DB_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not configured in GitHub Secrets"
              missing=1
            fi
          done
          exit "$missing"

      - name: Link Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Preview database migrations
        run: supabase db push --dry-run --password "$SUPABASE_DB_PASSWORD"

      - name: Deploy database migrations
        run: supabase db push --yes --password "$SUPABASE_DB_PASSWORD"

      - name: Deploy Edge Functions
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF"
