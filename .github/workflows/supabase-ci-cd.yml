name: Supabase CI/CD

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["**"]
  workflow_dispatch:
    inputs:
      deploy_to_supabase:
        description: "Deploy migrations and Edge Functions to Supabase"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: supabase-${{ github.ref }}
  cancel-in-progress: true

env:
  EXPO_NO_TELEMETRY: "1"
  EXPO_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
  EXPO_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
  SUPABASE_CLI_VERSION: 2.75.0

jobs:
  app-tests:
    name: App tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        continue-on-error: true
        run: npm audit --audit-level=high

      - name: Run unit tests
        run: npm test -- --runInBand

      - name: Compile TypeScript
        run: npx tsc --noEmit

      - name: Build web app
        run: npm run build

      - name: Smoke check exported web app
        run: test -f dist/index.html

  android-build-check:
    name: Android debug build
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Validate Expo app config
        run: npx expo config --type public

      - name: Generate native Android project
        run: npx expo prebuild --platform android --non-interactive

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Assemble Android debug build
        working-directory: android
        run: ./gradlew assembleDebug -x lint -x test

      - name: Smoke check Android artifact
        run: test -f android/app/build/outputs/apk/debug/app-debug.apk

  supabase-tests:
    name: Supabase tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: Verify Supabase CLI
        run: |
          command -v supabase
          supabase --version

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: latest

      - name: Bootstrap local database
        run: supabase db reset

      - name: Lint database schema
        run: supabase db lint --local --schema public --fail-on error

      - name: Run database tests
        run: supabase test db supabase/tests/database

      - name: Lint Edge Functions
        run: deno lint supabase/functions

      - name: Type-check Edge Functions
        run: find supabase/functions -name "index.ts" -print0 | xargs -0 deno check

      - name: Stop local Supabase
        if: always()
        run: |
          if command -v supabase >/dev/null 2>&1; then
            supabase stop --no-backup
          else
            echo "Supabase CLI not available; skipping cleanup step."
          fi

  deploy-supabase:
    name: Deploy Supabase
    runs-on: ubuntu-latest
    needs: [app-tests, android-build-check, supabase-tests]
    environment: production
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' ||
      github.event_name == 'workflow_dispatch' && inputs.deploy_to_supabase == true

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      DEVICE_SYNC_SHARED_SECRET: ${{ secrets.DEVICE_SYNC_SHARED_SECRET }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: Verify Supabase CLI
        run: |
          command -v supabase
          supabase --version

      - name: Check Supabase secrets
        run: |
          missing=0
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_PROJECT_REF SUPABASE_DB_PASSWORD DEVICE_SYNC_SHARED_SECRET; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not configured in GitHub Secrets"
              missing=1
            fi
          done
          exit "$missing"

      - name: Link Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Preview database migrations
        run: supabase db push --dry-run --password "$SUPABASE_DB_PASSWORD"

      - name: Deploy database migrations
        run: supabase db push --yes --password "$SUPABASE_DB_PASSWORD"

      - name: Sync Supabase runtime secrets
        run: |
          supabase secrets set \
            DEVICE_SYNC_SHARED_SECRET="$DEVICE_SYNC_SHARED_SECRET" \
            --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy Edge Functions
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF"

      - name: Smoke check deployed migrations
        run: |
          supabase migration list | grep 20260525153000

      - name: Smoke check deployed Edge Functions
        run: |
          supabase functions list | grep -E "welcome-user|manage-home|request-device-discovery|claim-device-discovery|complete-device-discovery|sync-network-devices"
